{% extends 'base.html' %}
{% block title %}Set New Password | AgroIntel{% endblock %}

{% block content %}
<div class="container py-5 d-flex align-items-center justify-content-center" style="min-height: 75vh;">
  <div class="w-100" style="max-width: 480px;">
    <div class="glass-card p-4 p-md-5">

      <div class="text-center mb-4">
        <div class="rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
             style="width: 56px; height: 56px; background: rgba(16,185,129,0.12); color: var(--emerald-500); font-size: 1.5rem;">
          <i class="fas fa-lock"></i>
        </div>
        <h3 class="text-bright font-weight-bold mb-1">Set New Password</h3>
        <p class="text-muted small">Enter and confirm your new secure password for <strong>{{ email }}</strong></p>
      </div>

      <form action="{{ url_for('reset_password', token=token) }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group mb-3">
          <label class="font-weight-bold small text-muted"><i class="fas fa-lock mr-1 text-emerald"></i> New Password</label>
          <input type="password" name="password" class="form-control form-control-agro" placeholder="Minimum 8 characters" required minlength="8" autocomplete="new-password">
        </div>

        <div class="form-group mb-4">
          <label class="font-weight-bold small text-muted"><i class="fas fa-lock-open mr-1 text-emerald"></i> Confirm New Password</label>
          <input type="password" name="confirm_password" class="form-control form-control-agro" placeholder="Re-enter password" required minlength="8" autocomplete="new-password">
        </div>

        <button type="submit" class="btn btn-agro-primary w-100 py-3 font-weight-bold fs-6">
          Update Password <i class="fas fa-check-circle ml-2"></i>
        </button>
      </form>

      <div class="mt-4 text-center border-top pt-3" style="border-color: var(--border-glass) !important;">
        <p class="mb-0 text-muted small">Cancel and return?
          <a href="{{ url_for('login', role='farmer') }}" class="font-weight-bold text-emerald">Back to Sign In</a>
        </p>
      </div>

    </div>
  </div>
</div>
{% endblock %}
