{% extends 'base.html' %}
{% block title %}Contact Support | AgroIntel{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="text-center mb-5">
        <span class="badge-agro badge-agro-cyan mb-2"><i class="fas fa-headset"></i> We're Here to Help</span>
        <h2 class="display-5 font-weight-extrabold text-white">Contact AgroIntel Team</h2>
        <p class="text-muted max-w-600 mx-auto">Have questions about crop models, buyer registration, or technical setup? Send us a message.</p>
      </div>

      <div class="glass-card p-4 p-md-5">
        <form action="{{ url_for('contact') }}" method="POST">
          <div class="form-group mb-3">
            <label class="font-weight-bold small text-muted">Full Name</label>
            <input type="text" name="name" class="form-control form-control-agro" placeholder="e.g. Anish Sharma" required>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6 mb-3 mb-md-0">
              <label class="font-weight-bold small text-muted">Mobile Number</label>
              <input type="text" name="mobile" class="form-control form-control-agro" placeholder="10 Digit Phone Number" required>
            </div>
            <div class="col-md-6">
              <label class="font-weight-bold small text-muted">Email Address</label>
              <input type="email" name="email" class="form-control form-control-agro" placeholder="name@example.com" required>
            </div>
          </div>

          <div class="form-group mb-3">
            <label class="font-weight-bold small text-muted">Location / Address</label>
            <input type="text" name="address" class="form-control form-control-agro" placeholder="City, State" required>
          </div>

          <div class="form-group mb-4">
            <label class="font-weight-bold small text-muted">Message</label>
            <textarea name="message" rows="4" class="form-control form-control-agro" placeholder="Tell us how we can assist you..." required></textarea>
          </div>

          <button type="submit" class="btn btn-agro-primary w-100 py-3 font-weight-bold">
            <i class="fas fa-paper-plane mr-2"></i> Submit Inquiry
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
